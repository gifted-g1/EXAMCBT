version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: examshield
      POSTGRES_PASSWORD: examshield
      POSTGRES_DB: examshield
    ports:
      - "5432:5432"
    volumes:
      - examshield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_PORT: 9000
      AI_SERVICE_HOST: 0.0.0.0
    ports:
      - "9000:9000"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      APP_ENV: production
      HTTP_PORT: 8080
      DATABASE_URL: "host=postgres user=examshield password=examshield dbname=examshield port=5432 sslmode=disable"
      JWT_SECRET: "change-me-in-production"
      JWT_ACCESS_TTL_MINUTES: "15"
      JWT_REFRESH_TTL_MINUTES: "10080"
      AI_SERVICE_URL: "http://ai-service:9000"
      CORS_ALLOWED_ORIGIN: "http://localhost:5173"
      EXAM_MODE: "online"
      LAN_PORT_RANGE_START: "8181"
      LAN_PORT_RANGE_END: "8199"
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8080/api/v1"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  examshield_pgdata:
