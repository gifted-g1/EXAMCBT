version: "3.9"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: examshield_root
      MYSQL_DATABASE: examshield
      MYSQL_USER: examshield
      MYSQL_PASSWORD: examshield
    ports:
      - "3306:3306"
    volumes:
      - examshield_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "examshield", "-pexamshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: examshield_root
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_PORT: 9000
      AI_SERVICE_HOST: 0.0.0.0
    ports:
      - "9000:9000"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      APP_ENV: production
      HTTP_PORT: 8080
      DATABASE_URL: "examshield:examshield@tcp(mysql:3306)/examshield?charset=utf8mb4&parseTime=True&loc=Local"
      JWT_SECRET: "change-me-in-production"
      JWT_ACCESS_TTL_MINUTES: "15"
      JWT_REFRESH_TTL_MINUTES: "10080"
      AI_SERVICE_URL: "http://ai-service:9000"
      CORS_ALLOWED_ORIGIN: "http://localhost:5173"
      EXAM_MODE: "online"
      LAN_PORT_RANGE_START: "8181"
      LAN_PORT_RANGE_END: "8199"
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8080/api/v1"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  examshield_mysqldata:
